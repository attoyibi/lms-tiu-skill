<body class="font-body-md text-on-surface antialiased overflow-hidden h-screen flex flex-col">
<!-- TopNavBar (Fixed) -->

<div class="flex justify-between items-center h-full px-6 max-w-7xl mx-auto w-full">
<div class="flex items-center gap-4">
<span class="text-xl font-bold tracking-tight text-indigo-700">TIU Prep</span>
<div class="h-6 w-px bg-slate-200 mx-2"></div>
<div class="flex flex-col">
<span class="font-label-md text-slate-500 uppercase tracking-widest text-[10px]">Sub-bab: Deret Angka</span>
<span class="font-title-lg text-on-surface text-[16px]">Tes Inteligensi Umum</span>
</div>
</div>
<div class="flex items-center gap-6">
<div class="flex items-center gap-3 bg-tertiary-container/10 px-4 py-2 rounded-xl border border-tertiary-container/20">
<span class="material-symbols-outlined text-tertiary leading-none" data-icon="timer">timer</span>
<span class="font-title-lg text-tertiary font-mono tabular-nums leading-none">24:15</span>
</div>
<div class="flex items-center gap-2">
<button class="p-2 text-slate-500 hover:text-indigo-500 transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="bg-primary text-on-primary px-6 py-2 rounded-lg font-semibold text-body-sm hover:opacity-90 active:scale-95 transition-all">
                        Finish Exam
                    </button>
</div>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow pt-16 flex overflow-hidden">
<!-- Left Sidebar: Progress Map (The Grid) -->
<aside class="w-80 flex-shrink-0 bg-white border-r border-slate-200 p-6 flex flex-col h-full">
<div class="mb-6">
<h3 class="font-title-lg text-slate-900 mb-1">Question Navigator</h3>
<p class="font-body-sm text-slate-500">Track your exam progress</p>
</div>
<div class="grid grid-cols-5 gap-3 sidebar-scroll overflow-y-auto pr-2 pb-10">
<!-- Question Dots: Answered, Active, Unanswered -->
<!-- Answered (Primary Style) -->
<button class="h-10 w-10 flex items-center justify-center rounded-lg bg-secondary-container text-on-secondary-fixed-variant font-bold border border-secondary/20">01</button>
<button class="h-10 w-10 flex items-center justify-center rounded-lg bg-secondary-container text-on-secondary-fixed-variant font-bold border border-secondary/20">02</button>
<button class="h-10 w-10 flex items-center justify-center rounded-lg bg-secondary-container text-on-secondary-fixed-variant font-bold border border-secondary/20">03</button>
<!-- Current (Primary) -->
<button class="h-10 w-10 flex items-center justify-center rounded-lg bg-primary text-on-primary font-bold shadow-md shadow-primary/20 ring-4 ring-primary/10">04</button>
<!-- Unanswered (Neutral) -->
<button class="h-10 w-10 flex items-center justify-center rounded-lg bg-surface-container-low text-slate-500 font-medium border border-slate-200 hover:border-primary/50 transition-colors">05</button>
<button class="h-10 w-10 flex items-center justify-center rounded-lg bg-surface-container-low text-slate-500 font-medium border border-slate-200">06</button>

<button class="h-10 w-10 flex items-center justify-center rounded-lg bg-surface-container-low text-slate-500 font-medium border border-slate-200">08</button>

<button class="h-10 w-10 flex items-center justify-center rounded-lg bg-tertiary-container/20 text-tertiary font-bold border border-tertiary/20 relative">09
                    <span class="absolute -top-1 -right-1 flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-tertiary"></span>
</span>
</button>
<!-- Generating the rest of the grid -->
<script>
                    for(let i=10; i<=35; i++) {
                        document.write(`<button class="h-10 w-10 flex items-center justify-center rounded-lg bg-surface-container-low text-slate-500 font-medium border border-slate-200">${i}</button>`);
                    }
                </script>
</div>
<div class="mt-auto pt-6 border-t border-slate-100 flex flex-col gap-3">

</div>

<span class="h-1.5 w-1.5 rounded-full bg-slate-200"></span>

<button class="flex items-center gap-2 px-8 py-3 bg-indigo-700 text-white rounded-xl font-bold hover:bg-indigo-800 shadow-lg shadow-indigo-200 transition-all active:scale-95 group">
